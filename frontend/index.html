<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HDB Resale Price Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>HDB Resale Price Checker</h1>

    <form id="estimate-form">

        <label for="month">Month</label>
        <input
            type="month"
            id="month"
            value="2026-11"
            required
        >


        <label for="town">Town</label>
        <input
            type="text"
            id="town"
            value="ANG MO KIO"
            required
        >


        <label for="flat_type">Flat Type</label>
        <input
            type="text"
            id="flat_type"
            value="2 ROOM"
            required
        >

   

        <label for="block">Block</label>
        <input
            type="text"
            id="block"
            value="323"
            required
        >


        <label for="street_name">Street Name</label>
        <input
            type="text"
            id="street_name"
            value="ANG MO KIO AVE 3"
            required
        >


        <label for="storey_range">Storey Range</label>
        <input
            type="text"
            id="storey_range"
            value="04 TO 06"
            required
        >


        <label for="floor_area_sqm">
            Floor Area (sqm)
        </label>
        <input
            type="number"
            id="floor_area_sqm"
            value="44"
            required
        >


        <label for="flat_model">Flat Model</label>
        <input
            type="text"
            id="flat_model"
            value="Improved"
            required
        >


        <label for="lease_commence_date">
            Lease Commencement Year
        </label>
        <input
            type="number"
            id="lease_commence_date"
            value="1977"
            required
        >


        <label for="remaining_lease">
            Remaining Lease
        </label>
        <input
            type="text"
            id="remaining_lease"
            value="49 years 10 months"
            required
        >


        <label for="asking_price">
            Asking Price
        </label>
        <input
            type="number"
            id="asking_price"
            value="320000"
        >


        <button type="submit">
            Check Asking Price
        </button>

    </form>

    <hr>

    <div id="status"></div>

    <div id="result"></div>

    <script src="app.js"></script>

</body>
</html>
